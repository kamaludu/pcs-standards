  utm_t0:
    threat_name: "Protocol/Logical Failure & Compliance Illusion"
    assurance_stage: "A5_CTRL_PASS"
  utm_t1:
    threat_name: "Legal Asymmetric / SLAPP & Copyright"
    assurance_stage: "A5_CTRL_PASS"
  utm_t2:
    threat_name: "Regulatory & Compliance Risk (GDPR/AI Act)"
    assurance_stage: "A5_CTRL_PASS"
  utm_t3:
    threat_name: "Correlation & Maintainer De-anonymization"
    assurance_stage: "A5_CTRL_PASS"
  utm_t4:
    threat_name: "Malfunctioning & Build Failure"
    assurance_stage: "A5_CTRL_PASS"
  utm_t5:
    threat_name: "Automated External Communication Surface & Egress Exposure"
    assurance_stage: "A5_CTRL_PASS"

